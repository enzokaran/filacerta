<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FilaCerta — Senhas e Chamadas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#f4f8f9;--card:#fff;--ink:#0d2b33;--mute:#5d7a83;--brand:#0e8f8a;--brand2:#0b6f6b;--accent:#ff7a3d;--line:#dbe7ea;--ok:#1a9a5b;--bad:#d64545}
@media (prefers-color-scheme:dark){:root{--bg:#0a1c21;--card:#12292f;--ink:#eaf6f6;--mute:#8fb0b6;--line:#1f3b42;--brand:#2fc4bd;--brand2:#22a8a1}}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:24px 20px;min-height:100vh;display:flex;flex-direction:column;gap:16px}
.wide{max-width:960px}
.brand{font-weight:700;color:var(--brand);display:flex;align-items:center;gap:8px;font-size:1.1rem}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;text-align:center}
h1{margin:.2em 0;font-size:2rem}p{color:var(--mute);margin:.4em 0}a{color:var(--brand)}
.btn{font:inherit;font-weight:700;border:0;border-radius:18px;padding:20px 24px;background:var(--brand);color:#fff;cursor:pointer;font-size:1.15rem;width:100%;transition:transform .15s,background .2s}
.btn:hover{background:var(--brand2)}.btn:active{transform:scale(.98)}
.btn.sec{background:var(--card);color:var(--ink);border:2px solid var(--line)}.btn.warn{background:var(--accent)}.btn.bad{background:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.label{font-size:.8rem;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.big{font-size:5rem;font-weight:800;line-height:1;color:var(--brand)}
.pill{display:inline-block;padding:6px 14px;border-radius:99px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);font-weight:600}
.called{background:var(--ok);color:#fff;border:0;animation:pulse 1.4s infinite}.called p,.called .label{color:#e9fff3}
@keyframes pulse{50%{transform:scale(1.02)}}
input,select{font:inherit;width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--card);color:var(--ink);margin:6px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:12px}
.stat .n{font-size:2.6rem;font-weight:800;color:var(--brand)}
.row{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);text-align:left}
.msg{color:var(--bad);font-weight:600}
.tv{min-height:100vh;display:grid;grid-template-columns:2fr 1fr;gap:3vw;padding:4vw;background:linear-gradient(135deg,#062a2e,#0b4d52);color:#fff}
.tv .main{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.tv .lab{font-size:3vw;letter-spacing:.3em;opacity:.8}.tv .code{font-size:26vw;font-weight:800;line-height:1;margin:.05em 0}
.tv .room{font-size:5vw;font-weight:700;color:#ffb98f;text-transform:uppercase}
.tv .side{display:flex;flex-direction:column;gap:2.5vw;justify-content:center}
.tv .box{background:rgba(255,255,255,.09);border-radius:2vw;padding:2vw}
.tv .hist div{font-size:2.6vw;padding:.6vw 0;border-bottom:1px solid rgba(255,255,255,.15)}
.tv .qr{display:flex;flex-direction:column;align-items:center;gap:1vw;font-size:2vw;text-align:center}
.tv .qr div{background:#fff;padding:1.2vw;border-radius:1.5vw}
.flash{animation:pop 1.2s ease}@keyframes pop{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.12);opacity:1;color:#ffd166}100%{transform:scale(1)}}
@media (max-width:800px){.tv{grid-template-columns:1fr}.tv .lab{font-size:6vw}.tv .room{font-size:8vw}.tv .hist div{font-size:5vw}.tv .qr{font-size:4vw}}
</style></head>
<body><div id="app"></div>
<script>
/* ====== CONFIGURAÇÃO (a anon key é pública por design; a segurança está no RLS) ====== */
const SUPABASE_URL='https://oxplcedaqlklsjtogdxq.supabase.co';
const SUPABASE_KEY='sb_publishable_cgtOhskxtRqSArnGuFjeAw_tcZzt-Xi';
let QUEUE='A';
const QUEUES={
 A:{name:'Consultório 1',who:'Dentista Enzo',room:'Consultório 1'},
 B:{name:'Consultório 2',who:'Karen · apenas consulta',room:'Consultório 2'}
};
const EMAIL_QUEUE={'karensimeia05@gmail.com':'B'}; /* só organiza a tela; a proteção real é o RLS no banco */
/* ================================================================================== */
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={AGUARDANDO:'Aguardando atendimento',CHAMADA:'Chamada',EM_ATENDIMENTO:'Em atendimento',ATENDIDA:'Atendida',PULADA:'Pulada'};
let chans=[],timers=[];
const cleanup=()=>{chans.forEach(c=>sb.removeChannel(c));chans=[];timers.forEach(clearInterval);timers=[]};
const listen=(table,cb)=>chans.push(sb.channel('c'+Math.random()).on('postgres_changes',{event:'*',schema:'public',table},cb).subscribe());
const go=p=>{history.pushState({},'',p);R()};
document.addEventListener('click',e=>{const a=e.target.closest('a[data-go]');if(a){e.preventDefault();go(a.dataset.go)}});
const brand=t=>`<div class="brand"><span class="dot"></span>FilaCerta${t?' — '+t:''}</div>`;

/* ---------- Som e voz (TV) ---------- */
function announce(d){
 try{const a=new (window.AudioContext||window.webkitAudioContext)();[880,1175].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.35;o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.start(t);o.stop(t+.65)})}catch(e){}
 if(d.voice_enabled&&'speechSynthesis' in window&&d.code){setTimeout(()=>{const u=new SpeechSynthesisUtterance(`Senha ${d.code[0]} ${Number(d.code.slice(1))}, dirigir-se ao ${d.room_name}.`);u.lang='pt-BR';speechSynthesis.cancel();speechSynthesis.speak(u)},900)}
}

/* ---------- Paciente ---------- */
function patient(){
 let st=null,prev=null,err='',step='queue',qk=null,mode=null,F={},types=[],busy=false;
 const digits=s=>String(s||'').replace(/\D/g,'');
 const cpfOk=c=>{if(!/^\d{11}$/.test(c)||/^(\d)\1+$/.test(c))return false;for(const n of[9,10]){let t=0;for(let i=0;i<n;i++)t+=c[i]*(n+1-i);if((t*10%11)%10!=c[n])return false}return true};
 const inp=(id,ph,type,v,x)=>`<input id="${id}" type="${type}" placeholder="${ph}" value="${esc(v||'')}" ${x||''}>`;
 const btn=(id,t,c)=>`<button class="btn ${c||''}" id="${id}">${t}</button>`;
 const lab=t=>`<p style="text-align:left;margin:10px 0 0">${t}</p>`;
 async function loadTypes(){const r=await sb.from('service_types').select('id,name').eq('active',true).order('sort');types=r.data||[]}
 function flow(){
  const E=`<p class="msg">${esc(err)}</p>`,V=`<a href="#" id="back" style="text-align:center;display:block;margin-top:14px">Voltar</a>`;
  const who=qk?`<p>${esc(QUEUES[qk].name+' · '+QUEUES[qk].who)}</p>`:'';
  if(step==='who')return `<div class="card"><h1>Bem-vindo</h1>${who}<br><div style="display:grid;gap:12px">${btn('old','JÁ TENHO CADASTRO')}${btn('newp','SOU NOVO PACIENTE','sec')}${btn('help','PRECISO DE AJUDA','sec')}</div>${E}${V}</div>`;
  if(step==='help')return `<div class="card"><h1>Precisa de ajuda?</h1><p>Procure a recepção. Uma pessoa da equipe faz seu cadastro e gera sua senha.</p>${V}</div>`;
  if(step==='login')return `<div class="card"><h1>Seu cadastro</h1>${who}${inp('cpf','CPF (somente números)','text',F.cpf,'inputmode="numeric" autocomplete="off"')}${lab('Data de nascimento')}${inp('bd','','date',F.bd)}<br>${btn('find','BUSCAR')}${E}${V}</div>`;
  if(step==='found')return `<div class="card"><h1>Encontramos seu cadastro.</h1><p>Olá, ${esc(F.first)}!</p><br>${btn('go','CONTINUAR')}${V}</div>`;
  if(step==='reg')return `<div class="card"><h1>Novo paciente</h1>${who}${inp('nm','Nome completo','text',F.name,'autocomplete="name"')}${inp('cpf','CPF (somente números)','text',F.cpf,'inputmode="numeric" autocomplete="off"')}${lab('Data de nascimento')}${inp('bd','','date',F.bd)}${inp('ph','Telefone com DDD','tel',F.phone,'autocomplete="tel"')}${inp('em','E-mail (opcional)','email',F.email,'autocomplete="email"')}<br>${btn('rgo','CONTINUAR')}${E}${V}</div>`;
  if(step==='svc')return `<div class="card"><h1>Qual atendimento você precisa?</h1><br><div style="display:grid;gap:12px">${types.map(t=>`<button class="btn svc" data-id="${t.id}">${esc(t.name)}</button>`).join('')||'<p>Nenhum tipo disponível.</p>'}</div>${E}${V}</div>`;
  return `<div class="card"><h1>Bem-vindo</h1><p>Com quem você vai ser atendido?</p><br><div style="display:grid;gap:12px">${Object.entries(QUEUES).map(([k,v])=>`<button class="btn pick" data-q="${k}" style="text-align:left"><span style="display:block">${esc(v.name)}</span><span style="display:block;font-weight:500;font-size:.95rem;opacity:.9">${esc(v.who)}</span></button>`).join('')}</div></div>`;
 }
 function bind(){
  const on=(id,f)=>{const x=$('#'+id);if(x)x.onclick=f},to=async(s2)=>{err='';step=s2;if(s2==='svc')await loadTypes();draw()};
  document.querySelectorAll('.pick').forEach(b=>b.onclick=()=>{qk=b.dataset.q;to('who')});
  on('old',()=>{mode='old';to('login')});on('newp',()=>{mode='new';to('reg')});on('help',()=>to('help'));
  on('back',e=>{e.preventDefault();to(step==='svc'?(mode==='old'?'found':'reg'):{who:'queue',login:'who',reg:'who',help:'who',found:'login'}[step]||'queue')});
  on('find',async()=>{const c=digits($('#cpf').value),b=$('#bd').value;F={cpf:c,bd:b};
   if(!cpfOk(c)||!b){err='Confira o CPF e a data de nascimento.';return draw()}
   const{data,error}=await sb.rpc('find_patient',{p_cpf:c,p_birth:b});const r=data&&data[0];
   if(error||!r){err='Não encontramos esse cadastro. Confira os dados ou escolha "Sou novo paciente".';return draw()}
   F.first=r.first_name;to('found')});
  on('go',()=>to('svc'));
  on('rgo',()=>{const n=$('#nm').value.trim(),c=digits($('#cpf').value),b=$('#bd').value,ph=digits($('#ph').value),em=$('#em').value.trim();F={name:n,cpf:c,bd:b,phone:ph,email:em};
   if(n.length<5||!n.includes(' '))err='Digite o nome completo.';
   else if(!cpfOk(c))err='CPF inválido. Confira os números.';
   else if(!b||b>new Date().toISOString().slice(0,10)||b<'1900-01-01')err='Data de nascimento inválida.';
   else if(ph.length<10||ph.length>11)err='Telefone inválido. Use DDD + número.';
   else if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))err='E-mail inválido.';
   else return to('svc');
   draw()});
  document.querySelectorAll('.svc').forEach(b=>b.onclick=async()=>{if(busy)return;busy=true;const sid=+b.dataset.id;
   const{data,error}=mode==='old'?await sb.rpc('self_checkin',{p_queue:qk,p_service:sid,p_cpf:F.cpf,p_birth:F.bd}):await sb.rpc('register_and_checkin',{p_queue:qk,p_service:sid,p_name:F.name,p_cpf:F.cpf,p_birth:F.bd,p_phone:F.phone,p_email:F.email||null});
   busy=false;
   if(error||!data||!data[0]){if(/CPF_JA_CADASTRADO/.test(error&&error.message||'')){err='Este CPF já possui um cadastro. Tente acessar seu cadastro existente.';step='who'}else err='Não foi possível gerar a senha. Tente novamente.';return draw()}
   localStorage.setItem('ticketId',data[0].ticket_id);localStorage.setItem('ticketQ',qk);F={};step='queue';load()});
 }
 const tid=()=>localStorage.getItem('ticketId');
 async function load(){
  if(!tid()){st=null;if(step==='queue')draw();return}
  const{data}=await sb.rpc('ticket_status',{p_id:tid()});const r=data&&data[0];
  if(!r||r.expired){localStorage.removeItem('ticketId');st=null}else st=r;
  if(st&&prev&&prev!=='CHAMADA'&&st.t_status==='CHAMADA'&&navigator.vibrate)navigator.vibrate([300,150,300]);
  prev=st&&st.t_status;draw();
 }
 function draw(){
  let h=`<div class="wrap">${brand()}`;
  if(!st)h+=flow();
  else{
   if(st.t_status==='CHAMADA'||st.t_status==='EM_ATENDIMENTO')h+=`<div class="card called"><div class="label">Sua senha foi chamada</div><h1>Dirija-se ao ${esc(st.t_room)}.</h1></div>`;
   h+=`<div class="card"><div class="label">Sua senha</div><div class="big">${esc(st.t_code)}</div><p>${(q=>q?esc(q.name+' · '+q.who):'')(QUEUES[localStorage.getItem('ticketQ')||String(st.t_code||'A')[0]])}</p><br><span class="pill">${ST[st.t_status]}</span></div>`;
   if(st.t_status==='AGUARDANDO')h+=`<div class="card"><div class="label">Pessoas à sua frente</div><div class="big" style="font-size:3.5rem">${st.ahead}</div><p>Não feche esta página. Você será chamado pelo painel.</p></div>`;
   if(st.t_status==='PULADA')h+=`<div class="card"><p>Sua senha foi pulada. Procure a recepção.</p></div>`;
   if(st.t_status==='ATENDIDA'||st.t_status==='PULADA')h+=`<button class="btn sec" id="new">Retirar nova senha</button>`;
   h+=`<p style="text-align:center">Acompanhando em tempo real ●</p>`;
  }
  app.innerHTML=h+'</div>';
  bind();
  const n=$('#new');if(n)n.onclick=()=>{localStorage.removeItem('ticketId');st=null;prev=null;step='queue';draw()};
 }
 listen('display_state',load);timers.push(setInterval(load,8000));load();
}

/* ---------- TV ---------- */
function tv(){
 QUEUE=new URLSearchParams(location.search).get('fila')==='B'?'B':'A';
 let d={},hist=[],lastN=null,first=true,snd=false;
 async function load(){
  const a=await sb.from('display_state').select('*').eq('queue_id',QUEUE).single();d=a.data||{};
  const h=await sb.rpc('recent_calls',{p_queue:QUEUE,p_limit:4});hist=h.data||[];
  const fresh=!first&&d.call_nonce&&d.call_nonce!==lastN;
  if(d.call_nonce)lastN=d.call_nonce;first=false;
  draw(fresh);if(fresh&&snd)announce(d);
 }
 function draw(fresh){
  app.innerHTML=`<div class="tv"><div class="main"><div class="room" style="font-size:3vw;color:#fff;opacity:.85">${esc(QUEUES[QUEUE].name+' · '+QUEUES[QUEUE].who)}</div><div class="lab">SENHA ATUAL</div><div class="code ${fresh?'flash':''}">${esc(d.code||'—')}</div>
  <div class="lab" style="font-size:2.2vw">${d.room_name?'DIRIJA-SE AO':''}</div><div class="room">${esc(d.room_name||'Aguardando chamada')}</div>
  ${snd?'':'<button class="btn warn" id="snd" style="width:auto;margin-top:3vw">Ativar som e voz</button>'}</div>
  <div class="side"><div class="box hist"><div class="lab" style="font-size:1.8vw">ÚLTIMAS CHAMADAS</div>${hist.map(t=>`<div>${esc(t.r_code)} — ${esc(t.r_room)}</div>`).join('')||'<div>—</div>'}</div>
  <div class="box qr"><div id="qr"></div><span>Escaneie para retirar sua senha</span></div></div></div>`;
  try{new QRCode($('#qr'),{text:location.origin+'/patient',width:180,height:180})}catch(e){}
  const s=$('#snd');if(s)s.onclick=()=>{snd=true;draw(false)};
 }
 listen('display_state',load);timers.push(setInterval(load,15000));load();
}

/* ---------- Login ---------- */
function login(msg=''){
 cleanup();
 app.innerHTML=`<div class="wrap">${brand()}<div class="card"><h1>Acesso restrito</h1><p>Somente equipe autorizada.</p>
 <input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password">
 <br><button class="btn" id="go">ENTRAR</button><p class="msg">${esc(msg)}</p></div><a data-go="/patient" href="/patient" style="text-align:center">Voltar</a></div>`;
 const enter=async()=>{const{error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});error?login('E-mail ou senha incorretos.'):go('/admin')};
 $('#go').onclick=enter;$('#pw').onkeydown=e=>{if(e.key==='Enter')enter()};
}

/* ---------- Admin ---------- */
async function admin(){
 const{data:{session}}=await sb.auth.getSession();if(!session)return go('/login');
 const{data:prof}=await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
 if(!prof||!prof.active){await sb.auth.signOut();return login('Sua conta não tem permissão de equipe.')}
 QUEUE=prof.queue_id||EMAIL_QUEUE[(session.user.email||'').toLowerCase()]||'A';
 let rooms=(await sb.from('rooms').select('name').order('sort')).data||[];
 if(QUEUE==='B')rooms=[{name:QUEUES.B.room}];
 let room=rooms[0]?rooms[0].name:'',confirm=false,d={},T=[];
 const run=async(fn,args)=>{const{error}=await sb.rpc(fn,args);if(error)alert('Erro: '+error.message);load()};
 async function load(){
  const[a,q]=await Promise.all([sb.from('display_state').select('*').eq('queue_id',QUEUE).single(),sb.from('queues').select('session').eq('id',QUEUE).single()]);
  d=a.data||{};const t=await sb.from('tickets').select('*').eq('queue_id',QUEUE).eq('session',q.data.session).order('number');T=t.data||[];draw();
 }
 function draw(){
  const w=T.filter(t=>t.status==='AGUARDANDO'),cur=T.find(t=>t.code===d.code&&['CHAMADA','EM_ATENDIMENTO'].includes(t.status)),nxt=w[0];
  const done=T.filter(t=>t.status==='ATENDIDA').length,hist=T.filter(t=>t.called_at).sort((a,b)=>b.called_at.localeCompare(a.called_at)).slice(0,8);
  app.innerHTML=`<div class="wrap wide">${brand('Painel '+QUEUES[QUEUE].name+' · '+QUEUES[QUEUE].who)}<p>${esc(session.user.email)} · ${esc(prof.role)} · <a href="#" id="out">Sair</a></p>
  <div class="grid"><div class="card stat"><div class="label">Senha atual</div><div class="n">${esc(d.code||'—')}</div><p>${esc(d.room_name||'')}</p></div>
  <div class="card stat"><div class="label">Próxima</div><div class="n">${nxt?nxt.code:'—'}</div></div>
  <div class="card stat"><div class="label">Aguardando</div><div class="n">${w.length}</div></div>
  <div class="card stat"><div class="label">Atendidas</div><div class="n">${done}</div></div></div>
  <div class="card"><div class="label">Chamar para</div><select id="room">${(rooms||[]).map(r=>`<option ${r.name===room?'selected':''}>${esc(r.name)}</option>`).join('')}</select>
  <div class="grid"><button class="btn" id="next" ${nxt?'':'disabled'}>CHAMAR PRÓXIMA</button><button class="btn sec" id="re" ${d.code?'':'disabled'}>RECHAMAR</button>
  <button class="btn sec" id="skip" ${cur?'':'disabled'}>PULAR</button><button class="btn warn" id="end" ${cur?'':'disabled'}>ENCERRAR ATENDIMENTO</button></div>
  ${cur&&cur.status==='CHAMADA'?'<br><button class="btn sec" id="start">Iniciar atendimento</button>':''}</div>
  <div class="card" style="text-align:left"><div class="label">Histórico de chamadas</div>${hist.map(t=>`<div class="row"><b>${esc(t.code)}</b><span>${esc(t.room_name)}</span><span>${ST[t.status]}</span><span>${new Date(t.called_at).toLocaleTimeString('pt-BR')}</span></div>`).join('')||'<p>Sem chamadas.</p>'}</div>
  <div class="card"><label><input type="checkbox" id="voz" style="width:auto" ${d.voice_enabled?'checked':''}> Chamada por voz na TV</label><br><br>
  ${confirm?`<p><b>Tem certeza que deseja encerrar a fila atual?</b> Pendentes serão fechados e a numeração volta a A001 (o histórico é mantido).</p><div class="grid"><button class="btn bad" id="yes">SIM, ENCERRAR DIA</button><button class="btn sec" id="no">Cancelar</button></div>`:'<button class="btn bad" id="day">ENCERRAR DIA</button>'}
  <p style="margin-top:14px"><a href="/tv?fila=${QUEUE}" target="_blank">Abrir painel da TV</a> · <a href="/patient" target="_blank">Página do paciente</a></p></div></div>`;
  const on=(id,f)=>{const e=$('#'+id);if(e)e.onclick=f};
  $('#room').onchange=e=>room=e.target.value;
  on('next',()=>run('call_next',{p_queue:QUEUE,p_room:room}));on('re',()=>run('recall',{p_queue:QUEUE}));
  on('skip',()=>run('set_current_status',{p_queue:QUEUE,p_status:'PULADA'}));on('end',()=>run('set_current_status',{p_queue:QUEUE,p_status:'ATENDIDA'}));
  on('start',()=>run('set_current_status',{p_queue:QUEUE,p_status:'EM_ATENDIMENTO'}));
  on('day',()=>{confirm=true;draw()});on('no',()=>{confirm=false;draw()});on('yes',()=>{confirm=false;run('end_day',{p_queue:QUEUE})});
  $('#voz').onchange=e=>run('set_voice',{p_queue:QUEUE,p_enabled:e.target.checked});
  on('out',async e=>{e.preventDefault();await sb.auth.signOut();go('/login')});
 }
